<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8f2ee">
  <title>Pelican's Coastal Ride</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #d8f2ee; }
    .scene { position: relative; width: 100%; height: 100%; min-height: 360px; overflow: hidden; }
    .scene > svg { display: block; width: 100%; height: 100%; }
    #rider-scale { transform-box: view-box; transform-origin: 720px 780px; transform: scale(var(--rider-scale, 1)); }
    .ride-bob { animation: bob 1.2s ease-in-out infinite; }
    .wheel-spin { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
    .pedal-turn { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: 18% 35%; animation: wing 1.2s ease-in-out infinite; }
    .scarf-tail { transform-box: fill-box; transform-origin: right center; animation: flutter .65s ease-in-out infinite alternate; }
    .cloud-one { animation: cloud 46s linear infinite; }
    .cloud-two { animation: cloud 61s linear infinite reverse; }
    .shore-drift { animation: drift 18s linear infinite; }
    .road-drift { animation: drift 2.4s linear infinite; }
    .grass-drift { animation: drift 4.8s linear infinite; }
    #scene.is-paused *, #scene.is-paused *::before, #scene.is-paused *::after { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes wing { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-5deg); } }
    @keyframes flutter { to { transform: rotate(-9deg) scaleY(.88); } }
    @keyframes drift { to { transform: translateX(-450px); } }
    @keyframes cloud { to { transform: translateX(1450px); } }
    .motion-toggle {
      position: absolute; right: clamp(16px, 3vw, 44px); top: clamp(16px, 3vw, 38px);
      display: grid; place-items: center; width: 46px; height: 46px;
      border: 1.5px solid rgba(39, 63, 64, .3); border-radius: 50%;
      background: rgba(255, 255, 255, .78); color: #263f40;
      cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: background .2s, transform .2s;
    }
    .motion-toggle:hover { background: #fff; transform: scale(1.06); }
    .motion-toggle:focus-visible { outline: 3px solid #d66c51; outline-offset: 3px; }
    .motion-toggle svg { width: 19px; height: 19px; fill: currentColor; }
    .icon-play { display: none; }
    .is-paused + .motion-toggle .icon-play { display: block; }
    .is-paused + .motion-toggle .icon-pause { display: none; }
    @media (max-width: 600px) { .motion-toggle { width: 42px; height: 42px; } }
  </style>
</head>

  <script>
    const scene = document.querySelector('#scene');
    const toggle = document.querySelector('.motion-toggle');
    const rider = document.querySelector('#rider-scale');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let playing = true;

    function setPlaying(next) {
      playing = next;
      scene.classList.toggle('is-paused', !playing);
      if (playing) scene.unpauseAnimations();
      else scene.pauseAnimations();
      const label = playing ? 'Pause animation' : 'Play animation';
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('aria-pressed', String(!playing));
      toggle.title = label;
    }

    function fitRider() {
      const ratio = window.innerWidth / window.innerHeight;
      rider.style.setProperty('--rider-scale', String(Math.min(1, Math.max(.54, ratio * 1.28))));
    }

    toggle.addEventListener('click', () => setPlaying(!playing));
    reducedMotion.addEventListener('change', event => setPlaying(!event.matches));
    window.addEventListener('resize', fitRider);
    fitRider();
    setPlaying(!reducedMotion.matches);
  </script>
</body>
