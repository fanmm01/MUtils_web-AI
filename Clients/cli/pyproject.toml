[project]
name = "qa-cli"
version = "0.0.0"
description = "Command line client for the Q&A assistant"
requires-python = ">=3.12,<3.13"
dependencies = ["qa-contracts", "qa-client", "typer>=0.12,<1"]

[project.scripts]
qa = "qa_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_cli"]

[tool.uv.sources]
qa-contracts = { workspace = true }
qa-client = { workspace = true }
