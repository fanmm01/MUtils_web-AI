[project]
name = "qa-client"
version = "0.0.0"
description = "Thin Python HTTP SDK for the Q&A assistant API"
requires-python = ">=3.12,<3.13"
dependencies = ["qa-contracts", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_client"]

[tool.uv.sources]
qa-contracts = { workspace = true }
