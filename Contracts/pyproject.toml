[project]
name = "qa-contracts"
version = "0.0.0"
description = "Shared DTOs, error codes and ports for the Q&A assistant"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_contracts"]
