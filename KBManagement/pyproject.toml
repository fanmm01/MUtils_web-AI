[project]
name = "qa-kb-management"
version = "0.0.0"
description = "Knowledge-base lifecycle, content, imports, parsing and versions"
requires-python = ">=3.12,<3.13"
dependencies = ["qa-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_management"]

[tool.uv.sources]
qa-contracts = { workspace = true }
