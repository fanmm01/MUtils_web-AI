[project]
name = "qa-infrastructure"
version = "0.0.0"
description = "SQLite, file storage, index and model runtime adapters"
requires-python = ">=3.12,<3.13"
dependencies = ["qa-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_infrastructure"]

[tool.uv.sources]
qa-contracts = { workspace = true }
